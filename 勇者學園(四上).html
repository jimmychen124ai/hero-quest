<title>勇者學園四上冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&text=%E7%9A%93&display=swap">
<style>
/* Layout: kid game shell — slim top bar, big rounded cards, chunky "pressable" buttons, fixed icon tab bar at the bottom. */
:root{
  --bg:#EDF4FF;--bg2:#E1EBFB;--surface:#FFFFFF;--soft:#F4F8FF;--ink:#1F2A44;--muted:#5B6987;--line:#D2DCEE;
  --band:#2A3170;--band-ink:#FFF7E0;--band-muted:#BFC6EA;
  --gold:#FFC23D;--gold-ink:#3A2600;--ok:#1F9A65;--ok-soft:#DCF4E9;--bad:#E0464B;--bad-soft:#FDE3E3;--hint:#FFF3C7;
  --zh:#25A066;--ma:#3A78D8;--na:#EC8420;--so:#DA5279;
  --f-disp:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:22px;--press:0 4px 0 rgba(20,30,70,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12172B;--bg2:#182039;--surface:#1E2640;--soft:#252E4C;--ink:#EEF2FB;--muted:#A6B1CC;--line:#35416B;
  --band:#0B0F22;--band-ink:#FFF1C9;--band-muted:#9AA3C8;
  --gold:#FFC94F;--gold-ink:#3A2600;--ok:#3CC488;--ok-soft:#14362A;--bad:#F2696D;--bad-soft:#3E1F24;--hint:#3B3319;
  --zh:#42C384;--ma:#6B9DF0;--na:#F7A04B;--so:#F07A98;--press:0 4px 0 rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12172B;--bg2:#182039;--surface:#1E2640;--soft:#252E4C;--ink:#EEF2FB;--muted:#A6B1CC;--line:#35416B;
  --band:#0B0F22;--band-ink:#FFF1C9;--band-muted:#9AA3C8;
  --gold:#FFC94F;--gold-ink:#3A2600;--ok:#3CC488;--ok-soft:#14362A;--bad:#F2696D;--bad-soft:#3E1F24;--hint:#3B3319;
  --zh:#42C384;--ma:#6B9DF0;--na:#F7A04B;--so:#F07A98;--press:0 4px 0 rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;text-wrap:balance;line-height:1.3;margin:0}
.art{display:block;max-width:100%;height:auto}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit}
.brand b{font-family:var(--f-disp);font-weight:400;font-size:22px;letter-spacing:.04em}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:15px}
.me .lv{background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:2px 10px;font-family:var(--f-disp)}
.me .st{font-family:var(--f-disp);color:var(--gold)}
.xpbar{width:72px;height:10px;border-radius:10px;background:rgba(255,255,255,.18);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding-block:6px}
.bnav button{background:none;border:0;border-radius:14px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px;color:var(--muted);position:relative;font-family:var(--f-disp)}
.bnav button .i{font-size:24px;line-height:1.2}
.bnav button.on{background:var(--soft);color:var(--ink)}
.badge{position:absolute;top:0;right:calc(50% - 26px);min-width:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;font-family:var(--f-body);font-weight:700}
main{padding-block:18px 120px}
/* shared */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
.btn{border:0;border-radius:16px;padding:12px 22px;font-family:var(--f-disp);font-size:19px;background:var(--soft);color:var(--ink);border:2px solid var(--line);box-shadow:var(--press);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.go{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.big{font-size:22px;padding:14px 30px;border-radius:20px}
.btn.dark{background:var(--band);color:var(--band-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{font-size:15px;padding:6px 14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.back{background:none;border:0;color:var(--muted);padding:4px 0;font-size:16px;margin-bottom:8px;font-family:var(--f-disp)}
.shield{clip-path:polygon(50% 0,100% 13%,100% 56%,50% 100%,0 56%,0 13%);display:grid;place-items:center;font-family:var(--f-disp);color:#fff}
.stars{color:var(--gold);letter-spacing:1px;font-size:20px;white-space:nowrap}
.stars .off{color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:3px 12px;border-radius:999px;background:var(--soft);border:2px solid var(--line);color:var(--muted);font-family:var(--f-disp)}
.pbar{height:12px;border-radius:12px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--c,var(--gold));border-radius:10px}
.sec{font-size:24px;margin:26px 0 12px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 18px;font-family:var(--f-disp);font-size:20px;line-height:1.5}
.bubble::before{content:"";position:absolute;left:-12px;top:26px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;top:28px;border:8px solid transparent;border-right-color:var(--surface);border-left:0}
.note{font-size:14px;color:var(--muted)}
/* home */
.scene{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:16px 20px;background:linear-gradient(180deg,var(--bg2),var(--surface));border:2px solid var(--line);border-radius:var(--r)}
.scene .who{width:120px}
.scene .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.realms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.realm{text-align:left;padding:14px 16px 16px;background:var(--surface);border:3px solid var(--c);border-radius:var(--r);box-shadow:0 6px 0 var(--c);display:grid;gap:8px;position:relative;overflow:hidden}
.realm:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.realm .pic{display:flex;align-items:flex-end;justify-content:space-between;background:var(--soft);border-radius:16px;padding:8px 10px 4px;min-height:96px}
.realm .pic .emb{width:84px}
.realm .pic .pal{width:70px}
.realm h3{font-size:24px;color:var(--c)}
.realm .sub{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;color:var(--muted)}
.mon-card{display:flex;align-items:center;gap:14px;padding:12px 16px;border:3px solid var(--bad);border-radius:var(--r);background:var(--bad-soft);margin-top:14px}
.mon-card .m{width:76px;flex:none}
.mon-card b{font-family:var(--f-disp);font-weight:400;font-size:21px;display:block}
.mon-card .grow{flex:1;min-width:0}
/* realm page */
.rhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 18px;border-radius:var(--r);background:var(--c);color:#fff}
.rhead .pal{width:86px;background:rgba(255,255,255,.9);border-radius:50%;padding:6px}
.rhead h1{font-size:28px}
.rhead p{margin:2px 0 0;font-size:15px;opacity:.92}
.trail{display:flex;flex-direction:column;gap:18px;margin-top:22px;position:relative}
.stop{display:flex;align-items:center;gap:14px;width:min(100%,500px);margin-left:var(--x,0);position:relative;background:none;border:0;padding:0;text-align:left}
.stop+.stop::before{content:"";position:absolute;left:40px;top:-20px;height:20px;border-left:5px dotted var(--line)}
.stop .ball{width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--surface);border:4px solid var(--c);box-shadow:0 5px 0 var(--c);position:relative}
.stop .ball .n{position:absolute;bottom:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-disp);font-size:16px;display:grid;place-items:center;border:3px solid var(--surface)}
.stop.locked .ball{border-color:var(--line);box-shadow:0 5px 0 var(--line);filter:grayscale(1);opacity:.6}
.stop.locked .n{background:var(--muted)}
.stop .tx{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px}
.stop .tx b{display:block;font-family:var(--f-disp);font-weight:400;font-size:20px}
.stop .tx small{color:var(--muted);font-size:14px}
.stop.here .tx{border-color:var(--gold);border-width:3px}
.stop .mini{position:absolute;left:-6px;top:-38px;width:46px}
.stop.boss .ball{width:96px;height:96px;background:var(--band);border-color:var(--gold);box-shadow:0 5px 0 var(--gold)}
@media (max-width:560px){.stop{--x:0!important}}
.mix{padding:16px 18px;margin-top:26px}
.mix h3{font-size:22px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pick label{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-size:16px;cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--c)}
/* unit */
.uhead{display:flex;align-items:center;gap:14px}
.uhead .stk{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:40px;background:var(--surface);border:3px solid var(--c);box-shadow:0 4px 0 var(--c);flex:none}
.uhead h1{font-size:28px}
.utabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.utabs button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px;font-family:var(--f-disp);font-size:18px;color:var(--muted);box-shadow:var(--press)}
.utabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.talk{display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:start;margin-bottom:16px}
.les{display:flex;flex-wrap:wrap;gap:8px}
.les span{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:16px}
.les span i{font-style:normal;color:var(--c);font-family:var(--f-disp);margin-right:6px}
.ccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.ccard{padding:12px 16px}
.ccard h3{font-size:19px;margin-bottom:4px}
.ccard p{margin:0;font-size:15px;color:var(--muted);line-height:1.55}
.mm{display:flex;flex-direction:column;align-items:center}
.mm-root{background:var(--c);color:#fff;font-family:var(--f-disp);font-size:24px;padding:10px 26px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.mm-stem{width:5px;height:22px;background:var(--c)}
.mm-br{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%;border-top:5px solid var(--c);padding-top:18px;border-radius:6px}
.mm-b{background:var(--surface);border:3px solid var(--c);border-radius:18px;position:relative}
.mm-b::before{content:"";position:absolute;left:50%;top:-23px;height:20px;border-left:5px solid var(--c)}
.mm-b summary{list-style:none;padding:8px 14px;font-family:var(--f-disp);font-size:20px;background:var(--soft);border-radius:15px 15px 0 0;cursor:pointer;display:flex;justify-content:space-between}
.mm-b summary::after{content:"▾";color:var(--c)}
.mm-b:not([open]) summary{border-radius:15px}
.mm-b:not([open]) summary::after{content:"▸"}
.mm-b summary::-webkit-details-marker{display:none}
.mm-b ul{margin:0;padding:8px 14px 12px 32px;font-size:17px}
.mm-b li{margin:4px 0}
.start{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px 20px}
.start .m{width:120px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.hp{background:var(--gold)}.dots i.no{background:var(--bad)}.dots i.now{outline:3px solid var(--c);outline-offset:1px}
.combo{font-family:var(--f-disp);color:var(--na);font-size:18px;white-space:nowrap}
.battle{display:grid;grid-template-columns:76px 1fr 96px;align-items:end;gap:10px;background:linear-gradient(180deg,var(--bg2),var(--soft));border:2px solid var(--line);border-radius:var(--r);padding:8px 14px 4px;margin-bottom:12px}
.battle .hp{align-self:center;display:grid;gap:4px;justify-items:center;font-family:var(--f-disp);font-size:15px;color:var(--muted)}
.battle .hp .pbar{width:100%;max-width:220px}
.battle .hp .pbar i{background:var(--bad)}
.qcard{padding:18px 20px 20px;border:3px solid var(--c)}
.qtext{font-family:var(--f-disp);font-size:clamp(21px,3.4vw,26px);margin:8px 0 16px;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--soft);font-size:19px;min-height:62px;box-shadow:var(--press)}
.opt .k{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-family:var(--f-disp);font-size:17px}
.opt.sel{border-color:var(--c);background:var(--surface);box-shadow:0 4px 0 var(--c)}
.opt.sel .k{background:var(--c);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:none;opacity:.8}
.opt.gone{opacity:.3;box-shadow:none;text-decoration:line-through}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin input{font-size:28px;font-family:var(--f-disp);padding:10px 16px;width:min(260px,100%);border-radius:16px;border:3px solid var(--c);background:var(--surface);font-variant-numeric:tabular-nums}
.numin span{font-family:var(--f-disp);font-size:22px}
.qbar{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.hintbox{margin-top:14px;padding:12px 16px;border-radius:16px;background:var(--hint);border:2px dashed var(--gold);font-size:17px}
.hintbox p{margin:4px 0}
.fb{margin-top:16px;padding:14px 18px;border-radius:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fb.ok{background:var(--ok-soft);border:3px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:3px solid var(--bad)}
.fb.re{background:var(--hint);border:3px solid var(--gold)}
.fb .who{width:70px}
.fb h3{font-size:24px;margin-bottom:4px}
.fb p{margin:3px 0;font-size:17px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-variant-numeric:tabular-nums}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.minibar{display:grid;gap:6px;margin:10px 0;max-width:420px;font-size:17px;font-family:var(--f-body)}
.mb-row{display:grid;grid-template-columns:60px 1fr 36px;gap:8px;align-items:center}
.mb-row i{display:block;height:18px;border-radius:6px;background:var(--c)}
.mini-t{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:10px 0;max-width:440px;font-size:16px;font-family:var(--f-body);text-align:center}
.mini-t span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 0}
/* result */
.result{text-align:center;padding:22px 18px}
.result .pics{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.result .pics .h{width:120px}.result .pics .m{width:110px}
.result .big{font-size:56px;letter-spacing:8px;color:var(--gold);line-height:1.2}
.result .big .off{color:var(--line)}
.result h1{font-size:32px;margin:4px 0}
.tally{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:12px 0}
.tally div{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:8px 14px;min-width:100px}
.tally b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:400}
.tally span{font-size:14px;color:var(--muted)}
.gotstk{display:inline-flex;align-items:center;gap:10px;background:var(--hint);border:2px dashed var(--gold);border-radius:18px;padding:8px 16px;font-family:var(--f-disp);font-size:20px;margin:6px 0}
.gotstk span{font-size:40px}
@media (prefers-reduced-motion:no-preference){
 .pop{animation:pop .4s cubic-bezier(.3,1.6,.6,1)}@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}
 .hit{animation:hit .5s}@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-8deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
 .bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
 .realm,.opt,.stop .ball{transition:transform .12s}
}
.logo{width:44px;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.ctile{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px;display:grid;grid-template-columns:64px 1fr;gap:4px 12px;align-items:center;box-shadow:var(--press)}
.ctile.weak{border-color:var(--bad)}
.ctile .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--soft);border:3px solid var(--c);grid-row:span 2}
.ctile h3{font-size:21px;line-height:1.25}
.ctile .meter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.ctile .meter .pbar{flex:1;height:10px}
.ctile details{grid-column:1/-1;margin-top:4px}
.ctile summary{list-style:none;cursor:pointer;font-family:var(--f-disp);color:var(--c);font-size:16px;display:inline-flex;gap:4px;align-items:center}
.ctile summary::-webkit-details-marker{display:none}
.ctile summary::before{content:"▶";font-size:12px}
.ctile details[open] summary::before{content:"▼"}
.ctile details p{margin:6px 0 0;padding:10px 12px;background:var(--hint);border-radius:14px;font-size:16px;line-height:1.6}
.ctile .go{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:4px}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.subhead{display:flex;align-items:center;gap:12px;margin:30px 0 12px;padding:8px 14px;border-radius:20px;background:var(--c);color:#fff}
.subhead .p{width:58px;background:rgba(255,255,255,.92);border-radius:50%;padding:4px;flex:none}
.subhead .e{width:62px;flex:none;margin-left:auto;background:rgba(255,255,255,.92);border-radius:12px;padding:4px}
.subhead h2{font-size:24px}
.subhead small{display:block;font-size:14px;opacity:.9;font-family:var(--f-body)}
.weakhead{display:flex;align-items:center;gap:12px;margin:18px 0 12px}
.weakhead .m{width:70px;flex:none}
.weakhead h2{font-size:24px}
.heroimg{position:relative;display:block;width:100%}
.heroimg img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:18%;border:3px solid var(--gold);box-shadow:0 4px 0 rgba(0,0,0,.18);background:var(--soft)}
.heroimg.sad img{filter:saturate(.55) brightness(.92)}
.heroimg .hb{position:absolute;top:-8px;right:-8px;font-size:clamp(14px,30%,30px);line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.stop .mini .heroimg img{border-width:2px}
/* notes / album / history */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-size:16px;font-family:var(--f-disp)}
.filters button.on{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.witem{padding:12px 16px;margin-bottom:10px;border-left:8px solid var(--bad)}
.witem.m{border-left-color:var(--ok);opacity:.75}
.witem .q{font-family:var(--f-disp);font-size:19px;margin-bottom:6px}
.witem .ans{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px}
.witem .x{color:var(--bad)}.witem .o{color:var(--ok);font-weight:700}
.witem .e{font-size:15px;color:var(--muted);margin-top:6px}
.wg h3{font-size:19px;margin:16px 0 8px;color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center}
.slot .s{font-size:46px;line-height:1.2;height:58px;display:grid;place-items:center}
.slot.lock .s{filter:grayscale(1) brightness(.3);opacity:.35}
.slot.gold{border-color:var(--gold);background:var(--hint)}
.slot b{display:block;font-family:var(--f-disp);font-weight:400;font-size:16px;line-height:1.3;margin-top:4px}
.slot small{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:12px 16px}
.stat b{display:block;font-size:30px;font-family:var(--f-disp);font-weight:400}
.stat span{font-size:14px;color:var(--muted)}
.subbars{display:grid;gap:12px;padding:16px 18px}
.subbar{display:grid;grid-template-columns:64px 1fr 130px;gap:12px;align-items:center;font-size:16px}
.subbar b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.subbar .r{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;align-items:center}
.tl li:last-child{border-bottom:0}
.tl .d{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.chartbox{padding:16px;overflow-x:auto}
/* parent (adult) */
.pin{max-width:380px;margin:10px auto;padding:24px;text-align:center}
.pin input{font-size:30px;letter-spacing:12px;text-align:center;width:200px;padding:8px;border-radius:14px;border:3px solid var(--line);background:var(--soft)}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.ptabs button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-size:15px}
.ptabs button.on{background:var(--gold);color:var(--gold-ink);border-color:transparent;font-weight:700}
.panel{padding:18px;margin-bottom:14px;font-size:16px}
.panel h3{font-size:20px;margin-bottom:10px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--soft);width:100%;font-size:16px}
.field textarea{min-height:110px;resize:vertical;font-size:15px}
.lockrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lockrow:last-child{border-bottom:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:14px}
.seg button.on{background:var(--band);color:var(--band-ink)}
.qrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.qrow .a{color:var(--ok);font-size:14px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px}
.foot{text-align:center;font-size:14px;color:var(--muted);margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:10px 20px;border-radius:999px;font-size:16px;z-index:20;font-family:var(--f-disp);white-space:nowrap}
@media (max-width:560px){
 .scene{grid-template-columns:96px 1fr;padding:12px}.scene .who{width:96px}.bubble{font-size:18px}
 .start{grid-template-columns:1fr;justify-items:center;text-align:center}.start .rules{justify-content:center}
 .battle{grid-template-columns:58px 1fr 74px}
 .subbar{grid-template-columns:56px 1fr}.subbar .r{grid-column:1/-1;text-align:left}
 .tl li{grid-template-columns:1fr auto}.tl .d{grid-column:1/-1}
 .me .xpbar{display:none}
 .talk{grid-template-columns:64px 1fr}
}

/* ========== 出題 ========== */
function buildUnitQuiz(id){
  const {s,u}=unitOf(id),n=+C.perQuiz||8,fx=shuffle(bank(u)).map(q=>tag(q,u,s)),g=gens(u);
  let list=[];
  if(g.length){const k=Math.min(fx.length,Math.ceil(n/3));list=fx.slice(0,k);let guard=0;const seen=new Set(list.map(q=>q.q));while(list.length<n&&guard++<60){const q=genQ(pick(g),u,s);if(!seen.has(q.q)){seen.add(q.q);list.push(q)}}}
  else list=fx.slice(0,n);
  return shuffle(list)}
function poolFrom(units,s,genEach){const pool=[];units.forEach(u=>{bank(u).forEach(q=>pool.push(tag(q,u,s)));gens(u).forEach(g=>{for(let i=0;i<genEach;i++)pool.push({gen:g,u,s})})});return pool}
function realize(list,n){const out=[],seen=new Set();for(const x of list){const q=x.gen?genQ(x.gen,x.u,x.s):x;if(seen.has(q.q))continue;seen.add(q.q);out.push(q);if(out.length>=n)break}return out}
const buildBoss=s=>realize(shuffle(poolFrom(SUBJ[s].units,s,1)),Math.max(10,+C.perQuiz||8));
const buildMix=(s,ids)=>realize(shuffle(poolFrom(SUBJ[s].units.filter(u=>ids.includes(u.id)),s,2)),20);
function buildConcept(c){const pool=[];ORDER.forEach(s=>SUBJ[s].units.forEach(u=>{bank(u).filter(q=>q.c===c).forEach(q=>pool.push(tag(q,u,s)));gens(u).filter(g=>g[0]===c).forEach(g=>{for(let i=0;i<3;i++)pool.push({gen:g,u,s})})}));return realize(shuffle(pool),6)}
function startQuiz(mode,list,meta){
  if(!list.length){toast('目前沒有可以練習的題目');return}
  Q=Object.assign({mode,list,i:0,res:[],combo:0,maxCombo:0,xp:0,wrongs:[],mastered:0},meta);
  prepQ();go({name:'quiz'})}
function prepQ(){const q=Q.list[Q.i];Object.assign(Q,{phase:'ask',tries:0,hints:0,sel:null,bad:[],elim:[],typed:'',anim:false,lastRes:null});Q.order=q.t==='mc'?shuffle(q.o.map((_,i)=>i)):null;Q.H=hintsOf(q)}

      return `<button class="opt ${cls}" data-act="pick" data-i="${oi}" ${dis?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${oh(q,q.o[oi])}</span></button>`}).join('')}</div>`
    :`<div class="numin"><input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="答案" ${done?'disabled':''} value="${esc(Q.typed)}"><span>${esc(q.unit)}</span></div>`;
  const canCheck=q.t==='mc'?Q.sel!=null:true;
  const hints=Q.hints?`<div class="hintbox">${Q.H.slice(0,Q.hints).map((h,i)=>`<p>💡 提示 ${i+1}：${h.text}</p>`).join('')}</div>`:'';
  let fb='';
  if(Q.phase==='retry')fb=`<div class="fb re pop"><div class="who">${heroSVG()}</div><div><h3>再想一次！</h3><p>還有一次機會，看看下面的提示。</p></div></div>`;
  if(done){const r=Q.lastRes;fb=`<div class="fb ${r==='miss'?'no':'ok'} pop"><div class="who">${heroSVG(r==='miss'?'sad':'cheer')}</div><div>
    <h3>${r==='indep'?pick(['命中！自己答對！','漂亮的一擊！','太強了！']):r==='help'?'答對了！':'這題先記下來'}</h3>

    <p class="note">${r==='indep'?'+10 經驗值':r==='help'?'+5 經驗值':'已放進錯題本'}</p></div></div>`}
  const label={unit:'闖關',boss:'魔王戰',wrong:'錯題重練',concept:'觀念特訓',mix:'段考特訓'}[Q.mode];

  <div class="battle"><div>${heroSVG(done&&Q.lastRes!=='miss'?'cheer':'')}</div><div class="hp"><span>${label}・${Q.i+1}/${n}</span><span class="pbar"><i style="width:${hpLeft/n*100}%"></i></span><span>魔物體力 ${hpLeft}</span></div><div>${monSVG(MONCOL[s],Q.mode==='boss',Q.anim)}</div></div>

function check(ok,my){
  const q=Q.list[Q.i];
  if(ok){finalizeQ(Q.tries===0&&Q.hints===0?'indep':'help');return}
  Q.tries++;
  if(Q.tries===1){const old=S.wrong[q.id]||{};S.wrong[q.id]={id:q.id,t:q.t,c:q.c,q:q.q,o:q.o,a:q.a,e:q.e,unit:q.unit,html:q.html,u:q.u,s:q.s,n:(old.n||0)+1,streak:0,mastered:false,last:Date.now(),my};Q.wrongs.push(q)}
  if(Q.tries<2){Q.phase='retry';if(q.t==='mc'&&Q.sel!=null)Q.bad.push(Q.sel);Q.sel=null;if(Q.hints<1)Q.hints=1;saveS();render();return}
  if(q.t==='mc'&&Q.sel!=null)Q.bad.push(Q.sel);
  finalizeQ('miss')}
function finalizeQ(r){
  const q=Q.list[Q.i];Q.phase='done';Q.lastRes=r;Q.res[Q.i]=r;S.answered++;
  const cs=S.cstat[q.c]||(S.cstat[q.c]={r:0,w:0});
  if(r==='miss'){Q.combo=0;cs.w++}
  else{S.correct++;Q.anim=true;
    if(r==='indep'){S.indep++;cs.r++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);const g=10+Math.min(Q.combo-1,5)*2;Q.xp+=g;S.xp+=g;
      const w=S.wrong[q.id];if(w&&!w.mastered&&Q.tries===0){w.streak=(w.streak||0)+1;if(w.streak>=2){w.mastered=true;w.mt=Date.now();Q.mastered++}}}
    else{cs.w++;Q.combo=0;Q.xp+=5;S.xp+=5}}
  saveS();render()}
function finish(){
  const n=Q.list.length,ind=Q.res.filter(r=>r==='indep').length,hp=Q.res.filter(r=>r==='help').length,pts=ind*2+hp,pct=pts/(2*n);
  let stars=0;
  if(Q.mode==='unit'||Q.mode==='boss'){const id=Q.mode==='boss'?Q.s+'-boss':Q.u;
    stars=pct>=.95?3:pct>=.8?2:pct*100>=C.pass?1:0;const st=S.units[id]||(S.units[id]={best:0,plays:0});const before=st.best;st.plays++;
    const sc=`${ind+hp}/${n}`;if(stars>st.best)st.best=stars;if(!st.bestPts||pts>st.bestPts){st.bestPts=pts;st.bestScore=sc}
    if(stars>before){const b=(stars-before)*30;S.xp+=b;Q.xp+=b}Q.newPass=before===0&&stars>0}
  S.log.unshift({ts:Date.now(),mode:Q.mode,s:Q.s||Q.list[0].s,u:Q.mode==='unit'?Q.u:Q.mode==='boss'?Q.s+'-boss':'',sc:ind+hp,ind,n,st:stars,label:Q.label||''});S.log=S.log.slice(0,300);
  Q.stars=stars;Q.ind=ind;Q.hp=hp;saveS();go({name:'result'})}

  else if(P.tab==='content'){
    const u=unitOf(P.uid).u,c=content(u);
    body=`<div class="card panel"><h3>課程導覽與心智圖</h3>${subSel}${unitSel}
     <div class="field"><label for="ct-goal">本關目標（夥伴對話框）</label><textarea id="ct-goal" style="min-height:60px">${esc(c.goal)}</textarea></div>
     <div class="field"><label for="ct-les">課次清單（一行一課）</label><textarea id="ct-les">${esc(c.lessons.join('\n'))}</textarea></div>
     <div class="field"><label for="ct-map">心智圖（一行一個分支，格式：分支：重點、重點、重點）</label><textarea id="ct-map" style="min-height:160px">${esc(c.map.map(b=>b[0]+'：'+b[1].join('、')).join('\n'))}</textarea></div>
     <div class="row"><button class="btn go" data-act="ctsave">儲存</button>${C.content[u.id]?'<button class="btn" data-act="ctrestore">還原預設內容</button>':''}</div></div>`}
  else if(P.tab==='set'){
    body=`<div class="card panel"><h3>一般設定</h3>
     <div class="field"><label for="st-name">勇者名字</label><input id="st-name" maxlength="12" value="${esc(C.name)}"></div>
     <div class="field"><label for="st-n">每關題數（5～15）</label><input id="st-n" type="number" min="5" max="15" value="${C.perQuiz}"></div>
     <div class="field"><label for="st-p">過關門檻（50～100；自己答對算 2 分、提示或第二次答對算 1 分）</label><input id="st-p" type="number" min="50" max="100" value="${C.pass}"></div>
     <div class="field"><label for="st-pin">修改家長密碼（4～8 位數字，空白表示不修改）</label><input id="st-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>
     <p id="stErr" class="note" style="color:var(--bad)" hidden></p><button class="btn go" data-act="stsave">儲存設定</button></div>`}
  else{
    const dump=JSON.stringify({v:2,state:S,custom:C});
    body=`<div class="card panel"><h3>匯出備份</h3><p class="note">學習紀錄只存在這台裝置。換裝置前，請複製下面的備份文字，貼到另一台裝置的「匯入備份」。</p>
     <div class="field"><textarea id="exp" readonly style="min-height:90px">${esc(dump)}</textarea></div><button class="btn" data-act="copy">複製備份文字</button></div>
     <div class="card panel"><h3>匯入備份</h3><div class="field"><label for="imp">貼上備份文字</label><textarea id="imp" style="min-height:90px"></textarea></div><p id="impErr" class="note" style="color:var(--bad)" hidden></p><button class="btn go" data-act="import">匯入（會覆蓋目前資料）</button></div>
     <div class="card panel"><h3>重設學習紀錄</h3><p class="note">清除經驗值、星星、錯題和日誌。自訂的題目與設定會保留。</p><button class="btn danger" data-act="reset">${P.resetArm?'再按一次確認清除':'清除學習紀錄'}</button></div>`}
  return `<div class="row" style="justify-content:space-between"><h1 style="font-size:28px">🔒 家長模式</h1><button class="btn sm" data-act="plock">鎖定並離開</button></div>
   <div class="ptabs">${tabs.map(([k,l])=>`<button class="${P.tab===k?'on':''}" data-act="ptab" data-t="${k}">${l}</button>`).join('')}</div>${body}`}

/* ========== 路由與事件 ========== */
function go(v){if(v.name!=='parent'){P.authed=false;P.edit=null}V=v;render();window.scrollTo(0,0)}
function render(){
  const map={home:vHome,subject:vSubject,unit:vUnit,quiz:vQuiz,result:vResult,wrong:vWrong,concept:vConcept,album:vAlbum,history:vHistory,parent:vParent};
  $('#app').innerHTML=header()+`<main class="wrap">${(map[V.name]||vHome)()}</main>`+bottomNav();
  if(Q)Q.anim=false}
const A={
 nav:d=>go({name:d.v}),
 subject:d=>go({name:'subject',s:d.s}),
 unit:d=>go({name:'unit',u:d.u,tab:'guide'}),
 locked:()=>toast('🔒 先通過前一關喔！'),
 utab:d=>{V.tab=d.t;render()},
 start:d=>{const{s}=unitOf(d.u);startQuiz('unit',buildUnitQuiz(d.u),{u:d.u,s})},
 boss:d=>startQuiz('boss',buildBoss(d.s),{s:d.s}),
 mix:d=>{const ids=[...(MIX[d.s]||[])];if(!ids.length){toast('先勾選至少一關');return}startQuiz('mix',buildMix(d.s,ids),{s:d.s})},
 retrain:d=>{const l=shuffle(pendingWrong().filter(w=>d.s==='all'||w.s===d.s)).slice(0,10).map(w=>Object.assign({},w));startQuiz('wrong',l,{s:l[0]&&l[0].s})},
 drill:d=>{const l=buildConcept(d.c);startQuiz('concept',l,{s:l[0]&&l[0].s,label:CON[d.c][0]})},
 pick:d=>{if(Q.phase==='done')return;Q.sel=+d.i;render()},
 hint:()=>{if(Q.hints>=2||Q.phase==='done')return;Q.hints++;if(Q.hints===2&&Q.H[1].elim){Q.elim=Q.H[1].elim.filter(i=>!Q.bad.includes(i));if(Q.elim.includes(Q.sel))Q.sel=null}render()},
 check:()=>{if(Q.phase==='done')return;const q=Q.list[Q.i];
  if(q.t==='mc'){if(Q.sel==null)return;check(Q.sel===q.a,q.o[Q.sel])}
  else{const el=$('#ans'),raw=(el.value||'').replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，\s]/g,'');if(raw===''){toast('先寫答案喔');return}const v=parseFloat(raw);Q.typed=el.value;const ok=!isNaN(v)&&Math.abs(v-+q.a)<1e-6;if(!ok&&Q.tries===0)Q.typed='';check(ok,el.value)}},
 next:()=>{if(Q.i+1<Q.list.length){Q.i++;prepQ();render();window.scrollTo(0,0)}else finish()},
 quit:()=>{const s=Q.s;if(Q.mode==='unit')go({name:'unit',u:Q.u,tab:'quiz'});else if(Q.mode==='boss'||Q.mode==='mix')go({name:'subject',s});else go({name:Q.mode==='wrong'?'wrong':'concept'})},
 wf:d=>{WF=d.f;render()},
 hf:d=>{HIST_SUB=d.f;render()},
 pin:()=>{const v=$('#pin').value;if(v===String(C.pin)){P.authed=true;render()}else{$('#pinErr').hidden=false;$('#pin').value='';$('#pin').focus()}},
 plock:()=>{P.authed=false;go({name:'home'})},
 ptab:d=>{P.tab=d.t;P.edit=null;P.resetArm=false;render()},
 psub:d=>{P.sub=d.s;P.uid=SUBJ[d.s].units[0].id;P.edit=null;render()},
 lockset:d=>{if(d.v==='auto')delete C.lock[d.id];else C.lock[d.id]=d.v;saveC();render();toast('關卡設定已更新')},
 edadd:()=>{P.edit='new';render()},
 edit:d=>{P.edit=+d.i;render()},
 edcancel:()=>{P.edit=null;render()},
 eddel:d=>{const u=unitOf(P.uid).u;const arr=bank(u).map(q=>Object.assign({},q));arr.splice(+d.i,1);C.qs[u.id]=arr;P.edit=null;saveC();render();toast('已刪除題目')},
 edrestore:()=>{delete C.qs[P.uid];P.edit=null;saveC();render();toast('已還原預設題目')},
 edsave:()=>{const u=unitOf(P.uid).u,t=$('#ed-t').value,q=$('#ed-q').value.trim(),e=$('#ed-e').value.trim(),c=$('#ed-c').value,h=$('#ed-h').value.trim(),err=$('#edErr');
  const fail=m=>{err.textContent=m;err.hidden=false};if(!q)return fail('請輸入題目。');
  let obj;if(t==='mc'){const o=[0,1,2,3].map(i=>$('#ed-o'+i).value.trim());if(o.some(x=>!x))return fail('四個選項都要填寫。');if(new Set(o).size<4)return fail('四個選項不可以重複。');obj={t,q,o,a:+$('#ed-a').value,e,c}}
  else{const n=parseFloat($('#ed-n').value);if(isNaN(n))return fail('正確答案要填數字。');obj={t,q,a:n,unit:$('#ed-u').value.trim(),e,c}}
  if(h)obj.h=h;
  const arr=bank(u).map(x=>Object.assign({},x));if(P.edit==='new'){obj.id='c-'+Date.now().toString(36);arr.push(obj)}else{obj.id=arr[P.edit].id;arr[P.edit]=obj}
  C.qs[u.id]=arr;P.edit=null;saveC();render();toast('題目已儲存')},
 ctsave:()=>{const u=unitOf(P.uid).u;const les=$('#ct-les').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const map=$('#ct-map').value.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{const m=l.split(/[：:]/);const b=m.shift().trim();return[b,m.join('：').split(/[、,，]/).map(x=>x.trim()).filter(Boolean)]});
  C.content[u.id]={goal:$('#ct-goal').value.trim(),lessons:les.length?les:u.lessons,map:map.length?map:u.map};saveC();render();toast('已儲存導覽與心智圖')},
 ctrestore:()=>{delete C.content[P.uid];saveC();render();toast('已還原預設內容')},
 stsave:()=>{const n=Math.min(15,Math.max(5,parseInt($('#st-n').value)||8)),p=Math.min(100,Math.max(50,parseInt($('#st-p').value)||70)),pin=$('#st-pin').value.trim(),err=$('#stErr');
  if(pin&&!/^\d{4,8}$/.test(pin)){err.textContent='密碼要是 4～8 位數字。';err.hidden=false;return}
  C.name=$('#st-name').value.trim()||'小勇者';C.perQuiz=n;C.pass=p;if(pin)C.pin=pin;saveC();render();toast(pin?'設定與新密碼已儲存':'設定已儲存')},
 copy:()=>{const t=$('#exp');const fb=()=>{t.select();toast('請按 Ctrl+C 或長按複製')};try{navigator.clipboard.writeText(t.value).then(()=>toast('已複製備份文字'),fb)}catch(e){fb()}},
 import:()=>{const err=$('#impErr');try{const d=JSON.parse($('#imp').value);if(!d||!d.state||!d.custom)throw 0;S=Object.assign(freshS(),d.state);C=Object.assign(freshC(),d.custom);saveS();saveC();P.authed=true;render();toast('備份已匯入')}catch(e){err.textContent='這段文字不是有效的備份，請確認整段都有貼上。';err.hidden=false}},
 reset:()=>{if(!P.resetArm){P.resetArm=true;render();return}S=freshS();saveS();P.resetArm=false;render();toast('學習紀錄已清除')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.type==='checkbox')return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset)}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.act;
 if(a==='puid'){P.uid=el.value;P.edit=null;render()}
 else if(a==='allopen'){C.allOpen=el.checked;saveC();render();toast(el.checked?'已全部解鎖':'已恢復個別設定')}
 else if(a==='gentoggle'){if(el.checked)delete C.genOff[P.uid];else C.genOff[P.uid]=true;saveC();toast(el.checked?'已開啟自動出題':'已關閉自動出題')}
 else if(a==='mixpick'){const set=MIX[el.dataset.s];if(el.checked)set.add(el.value);else set.delete(el.value)}
 else if(a==='edtype'){$('#ed-mc').hidden=el.value!=='mc';$('#ed-num').hidden=el.value!=='num'}});
document.addEventListener('input',e=>{if(e.target.id==='ans'&&Q)Q.typed=e.target.value});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ans'){e.preventDefault();A.check()}else if(e.target.id==='pin'){e.preventDefault();A.pin()}});
render();
</script>
